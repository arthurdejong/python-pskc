---

name: Test

on:
  push:
  pull_request:
  schedule:
    - cron: '9 0 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.9, '3.10', 3.11, 3.12, 3.13, 3.14, pypy3.11]
        flavour: [signxml]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip tox
      - name: Install development libraries
        if: "${{ startsWith(matrix.python-version, 'pypy') }}"
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxslt-dev
      - name: Run tox
        run: tox -e "$(echo py${{ matrix.python-version }}-${{ matrix.flavour }} | sed -e 's/[.]//g;s/pypypy/pypy/')" --skip-missing-interpreters false
  alternatives:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.13]
        flavour: [legacy, legacy-defusedxml, lxml]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip tox
      - name: Run tox
        run: tox -e "$(echo py${{ matrix.python-version }}-${{ matrix.flavour }} | sed -e 's/[.]//g;s/pypypy/pypy/')" --skip-missing-interpreters false
  tox_job:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tox_job: [docs, flake8, mypy, codespell]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - name: Install dependencies
        run: python -m pip install --upgrade pip tox
      - name: Run tox ${{ matrix.tox_job }}
        run: tox -e ${{ matrix.tox_job }} --skip-missing-interpreters false
